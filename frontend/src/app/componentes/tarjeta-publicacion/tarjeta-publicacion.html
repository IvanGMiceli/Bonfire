<article class="tarjeta">
  <header class="autor">
    @if (publicacion.autor.imagenPerfil) {
      <img class="avatar" [src]="publicacion.autor.imagenPerfil" [alt]="publicacion.autor.nombreUsuario" />
    } @else {
      <span class="avatar sin-foto">{{ publicacion.autor.nombreUsuario.charAt(0) }}</span>
    }
    <div class="datos-autor">
      <span class="nombre">{{ publicacion.autor.nombreUsuario }}</span>
      <span class="fecha">{{ publicacion.createdAt | date: 'dd/MM/yyyy HH:mm' }}</span>
    </div>
  </header>

  <h3>{{ publicacion.titulo }}</h3>
  <p class="mensaje">{{ publicacion.mensaje }}</p>

  @if (publicacion.imagen) {
    <img class="imagen" [src]="publicacion.imagen" [alt]="publicacion.titulo" />
  }

  <footer class="acciones">
    <button type="button" class="me-gusta" [class.dado]="leDiMeGusta" (click)="meGusta.emit(publicacion)">
      ☀ {{ publicacion.cantidadMeGusta }}
    </button>

    @if (puedeEliminar) {
      <button type="button" class="eliminar" (click)="eliminar.emit(publicacion)">Eliminar</button>
    }
  </footer>
</article>
